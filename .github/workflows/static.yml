<button class="action" onclick="copyRechnung()">Rechnungsgrund kopieren</button>
</div>

<script>
let cart = {};

function addItem(name, price, qty){
    if(!cart[name]) cart[name]={price:price, quantity:0};
    cart[name].quantity += qty;
    if(cart[name].quantity<0) cart[name].quantity=0;
    updateRechnung();
}

function updateRechnung(){
    let foodDessertCount=0;
    let drinkCount=0;
    let totalPrice=0;
    let itemsArr=[];
    
    let date = new Date();
    let formattedDate = `${String(date.getDate()).padStart(2,'0')}.` +
                        `${String(date.getMonth()+1).padStart(2,'0')}.` +
                        `${date.getFullYear()}`;

    for(let item in cart){
        if(cart[item].quantity>0){
            itemsArr.push(`${cart[item].quantity}x ${item}`);
            totalPrice += cart[item].quantity*cart[item].price;
            if(['Döner Kebap','Adana Kebap','Dönerbox','Lahmacun','Baklava','Künefe'].includes(item)){
                foodDessertCount += cart[item].quantity;
            } else {
                drinkCount += cart[item].quantity;
            }
        }
    }

    if(foodDessertCount+drinkCount==0){
        document.getElementById('rechnungText').innerText='Keine Artikel ausgewählt.';
        document.getElementById('gesamtText').innerText='';
        document.getElementById('personBlocks').innerHTML='';
        return;
    }

    let foodPerson = Math.ceil(foodDessertCount / 5);
    let drinkPerson = Math.ceil(drinkCount / 5);
    let personCount = Math.max(foodPerson, drinkPerson);

    let rechnungsgrund = `${formattedDate} | ${personCount}P | Usta Döner - ${itemsArr.join(', ')}`;
    document.getElementById('rechnungText').innerText = rechnungsgrund;
    document.getElementById('gesamtText').innerText = `Gesamtsumme: $${totalPrice}`;

    let blockHTML='';
    for(let i=0;i<personCount;i++){
        blockHTML+='<div class="person-block"></div>';
    }
    document.getElementById('personBlocks').innerHTML=blockHTML;
}

function resetCart(){
    cart={};
    updateRechnung();
}

function copyRechnung(){
    let text=document.getElementById('rechnungText').innerText;
    navigator.clipboard.writeText(text).then(()=>{alert('Rechnungsgrund kopiert!');});
}
</script>

